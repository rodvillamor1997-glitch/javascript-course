<head>
  <title>

  </title>

</head>


<body>

  <button onclick="
    console.log(`Cart Quantity: ${cartQuantity}`);
    ">

  </button>

  <button onclick="
    //All this code below is the same as the functioning code now
    // cartQuantity = cartQuantity + 1;
    // cartQuantity +=1;
    cartQuantity++;
    console.log(`Cart Quantity: ${cartQuantity}`);
    ">
    Add to Cart
  </button>

  <button onclick="
  // This code below is the same as the code we using now
  //cartQuantity = cartQuantity + 2;
  cartQuantity += 2;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    +2

  <button onclick="
  cartQuantity = cartQuantity + 3;
  // This code below same as the one using above
  //cartQuantity +=3;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    +3
  </button>

  <button onclick="
  cartQuantity +=4;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    +4
  </button>

  <button onclick="
  cartQuantity +=5;
  console.log(`Cart Quantity: ${cartQuantity}`);  
  ">
    +5
  </button>

  <button onclick="
  cartQuantity --;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    Remove from cart
  </button>

  <buton onclick="
  cartQuantity = cartQuantity - 2;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    -2
  </buton>

  <button onclick="
  cartQuantity -= 3;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">
    -3
  </button>

  <button onclick="
  cartQuantity = 0;
  console.log('Cart was reset.');
  console.log(`Cart Quantity: ${cartQuantity}`);

  </button>

    let cartQuantity = 0;
  </script>
